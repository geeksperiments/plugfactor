<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="50%" stop-color="#0f1526"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="220" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="55" x2="960" y2="55"/>
    <line x1="0" y1="110" x2="960" y2="110"/>
    <line x1="0" y1="165" x2="960" y2="165"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/>
  </g>

  <!-- Background DSP Sine/Saw Waveform -->
  <path d="M 420 110 Q 450 30, 480 110 T 540 110 T 600 110 T 660 110 T 720 110 T 780 110 T 840 110 T 900 110 T 950 110"
        fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.35" filter="url(#glow)"/>

  <!-- Logo Emblem -->
  <g transform="translate(44, 42)">
    <rect width="136" height="136" rx="28" fill="#111827" stroke="url(#iconGrad)" stroke-width="3"/>
    <!-- Stylized Rotary Knob + Audio Wave + Graph Nodes -->
    <circle cx="68" cy="68" r="44" fill="none" stroke="#1e293b" stroke-width="6"/>
    <path d="M 37 99 A 44 44 0 1 1 99 99" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Waveform inside knob -->
    <path d="M 42 70 L 52 70 L 59 46 L 68 92 L 77 54 L 84 70 L 94 70"
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Graph Lineage Dots -->
    <circle cx="37" cy="99" r="5" fill="#6366f1"/>
    <circle cx="68" cy="24" r="5" fill="#06b6d4"/>
    <circle cx="99" cy="99" r="5" fill="#10b981"/>
  </g>

  <!-- Typography -->
  <g transform="translate(208, 76)">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-1">
      Plug<tspan fill="#38bdf8">Factor</tspan>
    </text>
    <rect x="262" y="-30" width="134" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
    <text x="329" y="-13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#34d399">
      SDD + CMAJOR 1.0
    </text>

    <text x="0" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      The Autonomous Virtual Instrument &amp; Audio FX Software Factory
    </text>

    <!-- Sponsor Pill Badges -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="168" height="30" rx="8" fill="#131b2e" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8"/>
      <text x="28" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">Neo4j 4-Tier Memory</text>

      <rect x="180" y="0" width="182" height="30" rx="8" fill="#131b2e" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="196" cy="15" r="4.5" fill="#10b981"/>
      <text x="208" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">Daytona Sandbox QA</text>

      <rect x="374" y="0" width="174" height="30" rx="8" fill="#131b2e" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="390" cy="15" r="4.5" fill="#a78bfa"/>
      <text x="402" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">Nosana GPU Synth</text>

      <rect x="560" y="0" width="164" height="30" rx="8" fill="#131b2e" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="576" cy="15" r="4.5" fill="#fbbf24"/>
      <text x="588" y="19" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">VST3 / AU / Web</text>
    </g>
  </g>
</svg>
